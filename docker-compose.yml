version: "3.8"

services:
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: hapi-fhir
    ports:
      - "8080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"

  vista-unificada:
    build:
      context: ./vista_unificada
    container_name: vista-unificada
    ports:
      - "5000:5000"
